/**/dynamic_obstacle_costmap:
  dynamic_obstacle_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: true
      rolling_window: true
      width: 50
      height: 50
      resolution: 0.1
      robot_radius: 0.75
      plugins: ["foreground_mask_layer", "denoise_layer", "inflation_layer"]
      foreground_mask_layer:
        plugin: "foreground_mask::ForegroundMaskLayer"
        map_topic: "/fleet/skid_steered_two_lidars_0/map"
        inflation_radius: 20            #Inflate the static map region by this radius
        observation_sources: scan
        footprint_clearing_enabled: false
        max_obstacle_height: 2.0
        combination_method: 1
        scan:
          topic: /fleet/skid_steered_two_lidars_0/scan
          raytrace_max_range: 50.0
          raytrace_min_range: 0.0
          obstacle_max_range: 49.5
          obstacle_min_range: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: false
      denoise_layer:
        plugin: "nav2_costmap_2d::DenoiseLayer"
        enabled: true
        minimal_group_size: 3
        group_connectivity_type: 8
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.5
